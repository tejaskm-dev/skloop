name: CI

# Catches the class of failure that shipped undetected before: a module-scope
# `throw` on a missing env var broke `next build` entirely, and nothing ran to
# notice. The build here deliberately runs WITHOUT real secrets so that any
# code requiring a secret at build time fails here rather than at deploy.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The registry occasionally drops connections mid-install (ECONNRESET).
      # Without retries CI fails on infrastructure rather than on code, and a
      # workflow that cries wolf is one people learn to ignore.
      - name: Configure npm retries
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-timeout 600000

      - name: Install
        run: |
          for attempt in 1 2 3; do
            echo "::group::npm ci (attempt $attempt/3)"
            if npm ci --no-audit --no-fund; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "attempt $attempt failed"
            # A partial install can leave node_modules inconsistent.
            rm -rf node_modules
            sleep $((attempt * 15))
          done
          echo "npm ci failed after 3 attempts"
          exit 1

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        # Style debt is pre-existing and large; surface it without gating on it.
        run: npx eslint . --quiet
        continue-on-error: true

      - name: Build
        # Dummy values only. A build that needs a real secret is a bug — see
        # lib/server/groq.ts for the pattern that fixed it.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run build

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Dependency audit (production)
        # Reports without blocking; some advisories need breaking upgrades, and
        # a registry hiccup here should never fail the run either.
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
